[project]
name = 'roastery-workspace'
version = '0.0.0'
description = 'The roastery: the shop app, its simulator and the data contract'
requires-python = '>=3.13'

[tool.uv]
package = false

[tool.uv.workspace]
members = ['packages/*']

[tool.uv.sources]
roastery = { workspace = true }
roastery-spec = { workspace = true }
roastery-sim = { workspace = true }
roastery-api = { workspace = true }

[dependency-groups]
dev = [
    'pytest>=8',
    'ruff>=0.7',
    'httpx>=0.27',
    'roastery',
    'roastery-spec',
    'roastery-sim',
    'roastery-api',
]

[tool.pytest.ini_options]
testpaths = ['packages']
addopts = '--import-mode=importlib'
