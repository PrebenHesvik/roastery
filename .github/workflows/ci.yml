name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python -m pytest
      - run: uv run python -m roastery_sim tiny --out build/tiny
      - run: uv run python -m pytest packages/spec --tiny build/tiny/data
